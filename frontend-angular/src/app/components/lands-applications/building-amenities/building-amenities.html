<app-header 
  [pageTitle]="'تطبيق الاراضي - بيانات المرافق'"
  [pageSubtitle]="'اختر العملية المطلوبة'"
  [showBackButton]="true"
  [showHomeButton]="true"
  [backButtonLabel]="'العودة'"
  [backButtonAriaLabel]="'العودة للقائمة الرئيسية'"
  (backClicked)="goBack()"
  (homeClicked)="goHome()"
  (logoutClicked)="logout()">
</app-header>

<div class="container">

  <h2 class="title">بحث عن مرافق المبنى</h2>

  <!-- Search Box -->
  <div class="search-box">
    <input 
      type="text" 
      [(ngModel)]="buildingNumber" 
      list="buildingsList"
      placeholder="أدخل رقم المبنى" 
      class="search-input"
      (keyup.enter)="searchAmenities()">

    <datalist id="buildingsList">
      <option *ngFor="let b of buildingsLookup" [value]="b.buildingNumber">{{ b.display }}</option>
    </datalist>

    <button class="search-btn" (click)="searchAmenities()" [disabled]="isLoading">
      🔎 <span>بحث</span>
    </button>
  </div>

  <!-- Results Section -->
  <div *ngIf="hasSearched" class="results-section">

    <div *ngIf="isLoading" class="no-results">جاري التحميل...</div>

    <!-- Add Button -->
    <div class="add-button-container">
      <button (click)="openAddModal()" class="add-btn-large" [disabled]="isLoading">
        ➕ إضافة مرفق جديد
      </button>
    </div>

    <!-- Table -->
    <table class="amenities-table" *ngIf="!isLoading && amenities.length > 0">
      <thead>
        <tr>
          <th>اسم المبنى</th>
          <th>اسم المرفق</th>
          <th>الإجراءات</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let a of amenities">
          <td>{{ a.buildingName }}</td>
          <td>{{ a.name }}</td>
          <td class="actions-cell">
            <div class="actions">
              <button (click)="deleteAmenity(a)" class="action-btn delete-btn" title="حذف">
                ❌
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Empty State -->
    <div *ngIf="!isLoading && amenities.length === 0" class="empty-state">
      <div class="empty-icon">❓❓</div>
      <p>لا توجد مرافق مسجلة لرقم المبنى: <strong>{{ buildingNumber }}</strong></p>
      <!-- <button (click)="openAddModal()" class="add-btn-large mt-4" [disabled]="isLoading">
        add_circle_outline إضافة مرفق جديد لهذا المبنى
      </button> -->
    </div>

  </div>
</div>

<!-- Modal لإضافة مرفق -->
<div class="modal-overlay" *ngIf="isModalOpen" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>اختيار مرفق لإضافته إلى المبنى رقم {{ buildingNumber }}</h3>
      <button class="close-btn" (click)="closeModal()">❌</button>
    </div>

    <div class="modal-body">
      <div class="search-box">
        <input
          type="text"
          [(ngModel)]="newAmenityName"
          placeholder="اسم المرفق الجديد"
          class="search-input">

        <input
          type="text"
          [(ngModel)]="newAmenityDescription"
          placeholder="وصف المرفق الجديد"
          class="search-input">

        <button class="search-btn" (click)="createNewAmenity()" [disabled]="isLoading">
          ➕ <span>إضافة مرفق</span>
        </button>
      </div>

      <table class="modal-table">
        <thead>
          <tr>
            <th>اختر</th>
            <th>اسم المرفق</th>
            <th>الوصف</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of availableAmenities; let i = index">
            <td class="checkbox-cell">
              <label class="checkbox-label">
                <input type="checkbox" 
                       [(ngModel)]="item.selected"
                       (change)="onAmenitySelect(item)">
                <span class="checkmark"></span>
              </label>
            </td>
            <td>{{ item.name }}</td>
            <td>{{ item.description }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="closeModal()">إلغاء</button>
      <button class="btn-confirm" 
              [disabled]="isLoading || !hasSelectedAmenities()"
              (click)="confirmAddAmenities()">
        💾 إضافة المرافق المحددة
      </button>
    </div>
  </div>
</div>
